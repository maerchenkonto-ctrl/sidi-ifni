<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:">
<title>Sidi Ifni Outdoor</title>
<style>
body{font-family:system-ui,Arial,sans-serif;max-width:640px;margin:0 auto;padding:16px;color:#0e2036;background:#fff}
h1{font-size:20px;margin:0 0 4px}
.d{color:#64748b;font-size:14px;margin-bottom:12px}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eadfcc;break-inside:avoid}
.it img{width:80px;height:80px;object-fit:contain;border:1px solid #eadfcc;border-radius:10px;background:#fff;flex:none}
.it .n{flex:1;font-weight:700}
.it .q{color:#64748b;font-weight:400;font-size:14px}
.it .p{font-weight:800;white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:14px 0}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#f7941d;color:#1b1200;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
@media print{button{display:none}}
</style>
</head>
<body>
<h1 id="h"></h1>
<div class="d" id="d"></div>
<div id="list"></div>
<div class="tot"><span id="tl"></span><span id="tv"></span></div>
<button id="pb" type="button"></button>
<script>
(function(){
var S={
 ar:{h:"طلبية جديدة",t:"المجموع",b:"حفظ كـ PDF",e:"الرابط غير صالح"},
 fr:{h:"Nouvelle commande",t:"Total",b:"Enregistrer en PDF",e:"Lien invalide"},
 en:{h:"New order",t:"Total",b:"Save as PDF",e:"Invalid link"},
 de:{h:"Neue Bestellung",t:"Summe",b:"Als PDF speichern",e:"Ungültiger Link"},
 es:{h:"Nuevo pedido",t:"Total",b:"Guardar como PDF",e:"Enlace no válido"}
};
var q=new URLSearchParams(location.search);
var l=q.get("l");var s=S[l]||S.ar;
document.documentElement.lang=S[l]?l:"ar";
document.documentElement.dir=(S[l]?l:"ar")==="ar"?"rtl":"ltr";
document.getElementById("h").textContent=s.h;
document.getElementById("tl").textContent=s.t;
document.getElementById("pb").textContent=s.b;
document.getElementById("pb").onclick=function(){window.print()};
document.getElementById("d").textContent=new Date().toLocaleString(S[l]?l:"ar");
var o;try{o=JSON.parse(q.get("o"))}catch(e){}
var list=document.getElementById("list");
if(!o||!Array.isArray(o.i)){list.textContent=s.e;return}
document.getElementById("tv").textContent=String(o.t||"");
o.i.slice(0,100).forEach(function(x){
 var r=document.createElement("div");r.className="it";
 if(/^[\w.\-]+\.(webp|jpg|jpeg|png)$/i.test(x.i||"")){var im=document.createElement("img");im.src=x.i;im.alt="";r.appendChild(im)}
 var n=document.createElement("div");n.className="n";n.textContent=String(x.n||"");
 var qq=document.createElement("div");qq.className="q";qq.textContent="× "+String(x.q||"");n.appendChild(qq);
 var p=document.createElement("div");p.className="p";p.textContent=String(x.p||"");
 r.appendChild(n);r.appendChild(p);list.appendChild(r);
});
})();
</script>
</body>
</html>
